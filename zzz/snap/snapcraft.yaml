# 对齐已上架 Tauri snap（勿再自创 WebKit 路径）：
# - https://snapcraft.io/faire-todo-app
# - https://snapcraft.io/addiction-tracker
# - https://github.com/tauri-apps/tauri/discussions/10326
# 本地：先 tauri build 出 deb，再 snapcraft pack --destructive-mode（勿 sudo）
name: redis-me
title: RedisME
base: core22
version: '4.6.1' # 与 package.json 保持一致
summary: Redis / Valkey desktop client
description: |
  RedisME is a desktop GUI for Redis and Valkey.
  Connect, browse keys, edit values, and manage multiple connections.
license: GPL-3.0
website: https://www.hepengju.com
source-code: https://github.com/hepengju/redis-me
contact: he_pengju@163.com
icon: snap/gui/redis-me.png

grade: devel
confinement: strict

architectures:
  - build-on: [amd64]
    build-for: [amd64]

# 与 faire / addiction-tracker 相同：symlink 到 stage 的 webkit，不要 bind、不要指 gnome-platform
layout:
  /usr/libexec/webkit2gtk-4.1:
    symlink: $SNAP/usr/libexec/webkit2gtk-4.1
  /usr/lib/x86_64-linux-gnu/webkit2gtk-4.1:
    symlink: $SNAP/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1
  /usr/lib/webkit2gtk-4.1/injected-bundle:
    symlink: $SNAP/usr/lib/webkit2gtk-4.1/injected-bundle

# single-instance：identifier com.hepengju.redis → org.com_hepengju_redis.SingleInstance
# https://v2.tauri.app/plugin/single-instance/
slots:
  single-instance:
    interface: dbus
    bus: session
    name: org.com_hepengju_redis.SingleInstance

plugs:
  single-instance-plug:
    interface: dbus
    bus: session
    name: org.com_hepengju_redis.SingleInstance

apps:
  redis-me:
    extensions: [gnome]
    command: usr/bin/RedisME
    desktop: usr/share/applications/redis-me.desktop
    plugs:
      - wayland
      - x11
      - home
      - desktop
      - unity7
      - network
      - removable-media # 导入导出额外挂载点（faire 无；我们业务需要）
      - single-instance-plug
    slots:
      - single-instance

package-repositories:
  - type: apt
    components: [main]
    suites: [noble]
    key-id: 78E1918602959B9C59103100F1831DDAFC42E99D
    url: http://ppa.launchpad.net/snappy-dev/snapcraft-daily/ubuntu

parts:
  redis-me:
    plugin: nil
    source: snap
    build-packages: [dpkg]
    # stage-packages 与 addiction-tracker 一致
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libayatana-appindicator3-1
      - libglu1-mesa
      - freeglut3
    override-build: |
      set -eu
      DEB="$CRAFT_PROJECT_DIR/src-tauri/target/release/bundle/deb/RedisME_${CRAFT_PROJECT_VERSION}_amd64.deb"
      dpkg -x "$DEB" "$CRAFT_PART_INSTALL/"
      cp "$CRAFT_PART_INSTALL/usr/share/applications/"*.desktop \
        "$CRAFT_PART_INSTALL/usr/share/applications/redis-me.desktop"
      sed -i \
        -e 's|^Exec=.*|Exec=redis-me %U|' \
        -e 's|^Icon=.*|Icon=/usr/share/icons/hicolor/128x128/apps/RedisME.png|' \
        "$CRAFT_PART_INSTALL/usr/share/applications/redis-me.desktop"
