# 包装 Tauri amd64 deb。先 tauri build，再 snapcraft pack --destructive-mode
# https://v2.tauri.app/distribute/snapcraft/
name: redis-me
title: RedisME
base: core24
version: '4.6.1' # 与 package.json 保持一致
summary: Redis / Valkey desktop client
description: |
  RedisME is a desktop GUI for Redis and Valkey.
  Connect, browse keys, edit values, and manage multiple connections.
license: GPL-3.0
website: https://www.hepengju.com
source-code: https://github.com/hepengju/redis-me
contact: he_pengju@163.com
icon: snap/gui/redis-me.png

grade: devel
confinement: strict

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

layout:
  /usr/lib/$CRAFT_ARCH_TRIPLET/webkit2gtk-4.1:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET/webkit2gtk-4.1

apps:
  redis-me:
    extensions: [gnome]
    # gnome 已含：desktop, desktop-legacy, wayland, x11, opengl, gsettings, mount-observe
    command: usr/bin/RedisME
    desktop: usr/share/applications/redis-me.desktop
    plugs:
      - network # 连 Redis
      - home # 导入导出选用户目录
      - unity7 # 托盘（官方 gnome 未含；faire / addiction-tracker 有）
    environment:
      WEBKIT_DISABLE_DMABUF_RENDERER: '1' # NVIDIA + WebKit

package-repositories:
  - type: apt
    components: [main]
    suites: [noble]
    key-id: 78E1918602959B9C59103100F1831DDAFC42E99D
    url: http://ppa.launchpad.net/snappy-dev/snapcraft-daily/ubuntu

parts:
  redis-me:
    plugin: nil
    source: snap
    build-packages: [dpkg]
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libayatana-appindicator3-1
    override-build: |
      set -eu
      DEB="$CRAFT_PROJECT_DIR/src-tauri/target/release/bundle/deb/RedisME_${CRAFT_PROJECT_VERSION}_amd64.deb"
      dpkg -x "$DEB" "$CRAFT_PART_INSTALL/"
      cp "$CRAFT_PART_INSTALL/usr/share/applications/"*.desktop \
        "$CRAFT_PART_INSTALL/usr/share/applications/redis-me.desktop"
      sed -i \
        -e 's|^Exec=.*|Exec=redis-me %U|' \
        -e 's|^Icon=.*|Icon=/usr/share/icons/hicolor/128x128/apps/RedisME.png|' \
        "$CRAFT_PART_INSTALL/usr/share/applications/redis-me.desktop"
