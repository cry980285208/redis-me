# RedisME Snap：包装 Tauri 已打好的 AppImage（本地试装与 GitHub Actions 共用此配方）
# 版本：与 package.json 保持一致（build 会校验）；AppImage 用 Tauri 默认产物路径
# 前置：先 tauri build，再 snapcraft pack --destructive-mode
name: redis-me
title: RedisME
base: core24
# 须与根目录 package.json 的 version 一致（勿用 craftctl：与 gnome 扩展冲突）
version: '4.6.1'
summary: Redis / Valkey desktop client
description: |
  RedisME is a desktop GUI for Redis and Valkey.
  Connect, browse keys, edit values, and manage multiple connections.
license: GPL-3.0
website: https://www.hepengju.com
source-code: https://github.com/hepengju/redis-me
issues: https://github.com/hepengju/redis-me/issues
contact: he_pengju@163.com

grade: devel
confinement: strict

# AppImage 自带大量动态加载库，library linter 会误报 unused
lint:
  ignore:
    - library:
        - opt/redis-me/**

# 首版只打 amd64；arm64 第二轮再加
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

apps:
  redis-me:
    command: bin/redis-me
    desktop: usr/share/applications/redis-me.desktop
    extensions: [gnome]
    # gnome 已含 desktop / wayland / x11 / opengl 等；业务再补 network / home
    plugs:
      - network
      - home
    environment:
      # NVIDIA + WebKit 常见崩溃缓解（可被用户环境覆盖）
      WEBKIT_DISABLE_DMABUF_RENDERER: '1'

parts:
  redis-me:
    plugin: nil
    # 只拉 snap/，避免整仓 node_modules；AppImage / package.json 走 CRAFT_PROJECT_DIR
    source: snap
    build-packages: [python3]
    override-build: |
      set -eu
      VERSION="$(python3 -c "import json; print(json.load(open('$CRAFT_PROJECT_DIR/package.json'))['version'])")"
      if [ "$VERSION" != "$CRAFT_PROJECT_VERSION" ]; then
        echo "version mismatch: package.json=$VERSION snapcraft.yaml=$CRAFT_PROJECT_VERSION" >&2
        echo "Keep snap/snapcraft.yaml version in sync with package.json." >&2
        exit 1
      fi

      # 默认：Tauri 标准产物路径；可选 REDIS_ME_APPIMAGE 覆盖（CI/调试用）
      if [ -n "${REDIS_ME_APPIMAGE:-}" ]; then
        APPIMAGE="$REDIS_ME_APPIMAGE"
      else
        APPIMAGE="$CRAFT_PROJECT_DIR/src-tauri/target/release/bundle/appimage/RedisME_${VERSION}_amd64.AppImage"
      fi
      if [ ! -f "$APPIMAGE" ]; then
        echo "AppImage not found: $APPIMAGE" >&2
        echo "Run tauri build first, or set REDIS_ME_APPIMAGE to an existing .AppImage." >&2
        exit 1
      fi

      chmod +x "$APPIMAGE"
      cd "$CRAFT_PART_BUILD"
      rm -rf squashfs-root
      "$APPIMAGE" --appimage-extract

      install -d "$CRAFT_PART_INSTALL/opt/redis-me"
      cp -a squashfs-root/. "$CRAFT_PART_INSTALL/opt/redis-me/"

      install -d "$CRAFT_PART_INSTALL/bin"
      cat > "$CRAFT_PART_INSTALL/bin/redis-me" << 'EOF'
      #!/bin/bash
      set -euo pipefail
      export APPDIR="$SNAP/opt/redis-me"
      exec "$APPDIR/AppRun" "$@"
      EOF
      chmod +x "$CRAFT_PART_INSTALL/bin/redis-me"

      # desktop：统一成 redis-me，供 snap 桌面集成
      install -d "$CRAFT_PART_INSTALL/usr/share/applications"
      DESKTOP_SRC="$(find "$CRAFT_PART_INSTALL/opt/redis-me" -path '*/usr/share/applications/*.desktop' -type f | head -n1)"
      if [ -z "$DESKTOP_SRC" ]; then
        DESKTOP_SRC="$(find "$CRAFT_PART_INSTALL/opt/redis-me" -name '*.desktop' -type f | head -n1)"
      fi
      install -m644 "$DESKTOP_SRC" "$CRAFT_PART_INSTALL/usr/share/applications/redis-me.desktop"
      sed -i \
        -e 's|^Exec=.*|Exec=redis-me %U|' \
        -e 's|^Icon=.*|Icon=redis-me|' \
        "$CRAFT_PART_INSTALL/usr/share/applications/redis-me.desktop"

      # 图标：与 Tauri 打包同源 src-tauri/resources/icons，装到 hicolor（供 Icon=redis-me）
      ICONS_DIR="$CRAFT_PROJECT_DIR/src-tauri/resources/icons"
      if [ -f "$ICONS_DIR/128x128.png" ]; then
        install -Dm644 "$ICONS_DIR/128x128.png" \
          "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/128x128/apps/redis-me.png"
      fi
      if [ -f "$ICONS_DIR/512x512.png" ]; then
        install -Dm644 "$ICONS_DIR/512x512.png" \
          "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/512x512/apps/redis-me.png"
      elif [ -f "$ICONS_DIR/128x128.png" ]; then
        install -Dm644 "$ICONS_DIR/128x128.png" \
          "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/256x256/apps/redis-me.png"
      fi
